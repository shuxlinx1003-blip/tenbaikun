<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>転売君 Ver.4 月別グラフ版</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#111}.container{max-width:640px;margin:auto}h1{text-align:center;font-size:30px}.box{background:#fff;border-radius:16px;padding:18px;margin-bottom:18px}h2{font-size:24px;margin:0 0 16px}label{display:block;margin-top:14px;font-weight:bold}input,select{width:100%;padding:14px;margin-top:6px;font-size:17px;border:1px solid #ccc;border-radius:10px;background:#fff}button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:12px;font-size:17px;font-weight:bold;color:#fff;background:#333}.save{background:#438f4c}.delete{background:#cf5b52}.deleteall{background:#555}.result,.monthly{font-size:18px;line-height:1.9;margin-top:16px}.sale-item{background:#fafafa;border:1px solid #ddd;border-radius:13px;padding:14px;margin-top:14px}.sale-name{font-size:20px;font-weight:bold;margin-bottom:10px}.good{color:green;font-weight:bold}.bad{color:#c33;font-weight:bold}.warning{color:#c87900;font-weight:bold}.message{text-align:center;margin-top:12px;font-weight:bold}.big{font-size:30px;font-weight:bold}.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.chart{min-width:900px;height:320px;display:flex;align-items:flex-end;gap:10px;padding:20px 10px 28px;border-left:1px solid #ddd;border-bottom:1px solid #ddd}.month-group{flex:1;min-width:62px;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative;padding-bottom:24px}.bar{width:16px;min-height:2px;border-radius:5px 5px 0 0}.sales{background:#2f80ed}.purchase{background:#f2994a}.profit{background:#27ae60}.month-label{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:13px;font-weight:bold}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:10px 0}.dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px}.month-summary{border-top:1px solid #eee;padding:10px 0;line-height:1.7}.year-select{width:auto;min-width:120px;margin:0}.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="container">
<h1>💰 転売君 Ver.4</h1>

<div class="box">
<h2>📊 利益計算</h2>
<label>商品名</label><input id="productName" placeholder="例：ワンピース">
<label>仕入れ価格</label><input id="purchase" type="number" placeholder="例：1000">
<label>販売価格</label><input id="sale" type="number" placeholder="例：2000">
<label>販売手数料（%）</label><input id="feeRate" type="number" value="10">
<label>送料</label>
<select id="shippingSelect">
<option value="160">ゆうパケットmini 160円</option>
<option value="210">ネコポス 210円</option>
<option value="215">ゆうパケットポスト 215円</option>
<option value="230">ゆうパケット 230円</option>
<option value="other">その他</option>
</select>
<input id="shippingOther" type="number" placeholder="送料を入力" style="display:none">
<button id="calculateButton">利益を計算</button>
<div id="result" class="result"></div>
<button id="saveSaleButton" class="save">💰 売れた商品として記録</button>
<div id="saveMessage" class="message"></div>
</div>

<div class="box">
<h2>🎯 500円利益</h2>
<button id="requiredPriceButton">500円利益に必要な販売価格</button>
<div id="requiredPrice" class="result"></div>
</div>

<div class="box">
<h2>📅 今月の売上</h2>
<div id="monthlyResult" class="monthly"></div>
</div>

<div class="box">
<div class="chart-head">
<h2 style="margin:0">📊 月別 売上・仕入れ・利益</h2>
<select id="chartYear" class="year-select"></select>
</div>
<div class="legend">
<span><span class="dot sales"></span>売上</span>
<span><span class="dot purchase"></span>仕入れ</span>
<span><span class="dot profit"></span>利益</span>
</div>
<div class="chart-scroll"><div id="barChart" class="chart"></div></div>
<div id="monthSummary"></div>
</div>

<div class="box">
<h2>📚 売上履歴</h2>
<div id="salesHistory"></div>
<button id="deleteAllButton" class="deleteall">🗑 売上履歴を全部削除</button>
<div id="deleteMessage" class="message"></div>
</div>
</div>

<script>
const STORAGE_KEY="tenbaikun_sales";
const OLD_KEYS=["tenbaikun_sales","salesData","tenbaikun_sales_v3","tenbaikun_sales_v5"];
let salesData=[];

function loadData(){
 let found=false;
 for(const key of OLD_KEYS){
  try{
   const saved=localStorage.getItem(key);
   if(!saved) continue;
   const parsed=JSON.parse(saved);
   if(Array.isArray(parsed)){salesData=parsed;found=true;break;}
  }catch(e){}
 }
 if(!found) salesData=[];
 salesData=salesData.map((x,i)=>{if(!x.id)x.id="old-"+i+"-"+Date.now();return x;});
 saveData();
}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(salesData));return true}catch(e){return false}}
function getShipping(){const v=document.getElementById("shippingSelect").value;return v==="other"?(Number(document.getElementById("shippingOther").value)||0):(Number(v)||0)}
document.getElementById("shippingSelect").addEventListener("change",function(){document.getElementById("shippingOther").style.display=this.value==="other"?"block":"none"});
function vals(){return{name:document.getElementById("productName").value.trim(),purchase:Number(document.getElementById("purchase").value),sale:Number(document.getElementById("sale").value),feeRate:Number(document.getElementById("feeRate").value),shipping:getShipping()}}
function calc(v){const fee=Math.round(v.sale*v.feeRate/100),profit=v.sale-v.purchase-fee-v.shipping,profitRate=v.purchase>0?(profit/v.purchase*100).toFixed(1):"0.0";return{fee,profit,profitRate}}
function calculate(){
 const v=vals(); if(v.purchase<=0||v.sale<=0){result.innerHTML='<span class="bad">仕入れ価格と販売価格を入力してください。</span>';return}
 const r=calc(v); let j="";
 if(r.profit>=500&&Number(r.profitRate)>=30)j='<div class="good">🟢 仕入れOK！かなり良い商品</div>';
 else if(r.profit>=500&&Number(r.profitRate)>=20)j='<div class="good">🟢 仕入れOK！利益500円以上</div>';
 else if(r.profit>=500)j='<div class="warning">🟡 利益500円以上ですが利益率は低め</div>';
 else j='<div class="bad">🔴 仕入れはおすすめしません</div>';
 result.innerHTML="販売手数料："+r.fee.toLocaleString()+"円<br>送料："+v.shipping.toLocaleString()+"円<br><strong>利益："+r.profit.toLocaleString()+"円</strong><br>利益率："+r.profitRate+"%<br><br>"+j;
}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addSale(){
 const v=vals(),m=document.getElementById("saveMessage"); if(!v.name){m.innerHTML='<span class="bad">商品名を入力してください。</span>';return}
 if(v.purchase<=0||v.sale<=0){m.innerHTML='<span class="bad">仕入れ価格と販売価格を入力してください。</span>';return}
 const r=calc(v); salesData.push({id:String(Date.now())+"-"+Math.random().toString(36).slice(2),name:v.name,purchase:v.purchase,sale:v.sale,fee:r.fee,shipping:v.shipping,profit:r.profit,profitRate:r.profitRate,date:today()});
 if(!saveData()){salesData.pop();m.innerHTML='<span class="bad">保存できませんでした。</span>';return}
 refresh();m.innerHTML='<span class="good">✅ 売上を記録しました</span>';
}
function displaySales(){
 const a=document.getElementById("salesHistory");a.innerHTML="";if(!salesData.length){a.textContent="まだ売上記録がありません。";return}
 for(let i=salesData.length-1;i>=0;i--){const x=salesData[i],b=document.createElement("div");b.className="sale-item";const n=document.createElement("div");n.className="sale-name";n.textContent="📦 "+(x.name||"商品名なし");const d=document.createElement("div");d.innerHTML="販売日："+(x.date||"-")+"<br>仕入れ："+Number(x.purchase||0).toLocaleString()+"円<br>販売："+Number(x.sale||0).toLocaleString()+"円<br>手数料："+Number(x.fee||0).toLocaleString()+"円<br>送料："+Number(x.shipping||0).toLocaleString()+"円<br><strong>利益："+Number(x.profit||0).toLocaleString()+"円</strong><br>利益率："+(x.profitRate??"-")+"%";const btn=document.createElement("button");btn.className="delete";btn.textContent="🗑 この記録を削除";btn.onclick=()=>deleteSale(x.id);b.append(n,d,btn);a.appendChild(b)}
}
function deleteSale(id){salesData=salesData.filter(x=>x.id!==id);saveData();refresh();deleteMessage.innerHTML='<span class="good">✅ 記録を削除しました</span>'}
function deleteAll(){salesData=[];saveData();refresh();deleteMessage.innerHTML='<span class="good">✅ 売上履歴を全部削除しました</span>'}
function calculateMonthly(){
 const d=new Date(),t=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");let c=0,s=0,p=0,pr=0;
 salesData.forEach(x=>{if(typeof x.date==="string"&&x.date.startsWith(t)){c++;s+=Number(x.sale)||0;p+=Number(x.purchase)||0;pr+=Number(x.profit)||0}});
 monthlyResult.innerHTML="📦 売れた商品数："+c+"件<br>💴 売上："+s.toLocaleString()+"円<br>🛒 仕入れ："+p.toLocaleString()+"円<br>💰 利益："+pr.toLocaleString()+"円";
}
function requiredPrice(){
 const purchase=Number(document.getElementById("purchase").value),feeRate=Number(document.getElementById("feeRate").value),shipping=getShipping();
 if(purchase<=0){requiredPrice.innerHTML='<span class="bad">仕入れ価格を入力してください。</span>';return}
 let price=Math.ceil((purchase+shipping+500)/(1-feeRate/100));while(true){const fee=Math.round(price*feeRate/100),profit=price-purchase-shipping-fee;if(profit>=500)break;price++}
 const fee=Math.round(price*feeRate/100),profit=price-purchase-shipping-fee;document.getElementById("requiredPrice").innerHTML="利益500円を出すための最低販売価格<br><br><span class='big'>"+price.toLocaleString()+"円</span><br><br>手数料："+fee.toLocaleString()+"円<br>送料："+shipping.toLocaleString()+"円<br><strong>利益："+profit.toLocaleString()+"円</strong>";
}
function years(){const y=new Set([new Date().getFullYear()]);salesData.forEach(x=>{if(typeof x.date==="string"&&/^\\d{4}-\\d{2}/.test(x.date))y.add(Number(x.date.slice(0,4)))});return Array.from(y).sort((a,b)=>b-a)}
function setupYear(){const s=document.getElementById("chartYear"),cur=s.value,ys=years();s.innerHTML="";ys.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y+"年";s.appendChild(o)});s.value=cur&&ys.includes(Number(cur))?cur:String(new Date().getFullYear())}
function mdata(y){const a=Array.from({length:12},(_,i)=>({m:i+1,sales:0,purchase:0,profit:0,count:0}));salesData.forEach(x=>{if(typeof x.date!=="string")return;const z=x.date.match(/^(\\d{4})-(\\d{2})/);if(!z)return;const yy=Number(z[1]),mm=Number(z[2]);if(yy!==Number(y)||mm<1||mm>12)return;const r=a[mm-1];r.sales+=Number(x.sale)||0;r.purchase+=Number(x.purchase)||0;r.profit+=Number(x.profit)||0;r.count++});return a}
function renderChart(){
 const y=Number(chartYear.value),rows=mdata(y),c=document.getElementById("barChart"),sum=document.getElementById("monthSummary");c.innerHTML="";sum.innerHTML="";
 const mx=Math.max(1,...rows.flatMap(r=>[r.sales,r.purchase,Math.max(0,r.profit)]));
 rows.forEach(r=>{const g=document.createElement("div");g.className="month-group";[[r.sales,"sales"],[r.purchase,"purchase"],[Math.max(0,r.profit),"profit"]].forEach(v=>{const b=document.createElement("div");b.className="bar "+v[1];let h=v[0]/mx*250;if(v[0]>0&&h<5)h=5;b.style.height=h+"px";g.appendChild(b)});const l=document.createElement("div");l.className="month-label";l.textContent=r.m+"月";g.appendChild(l);c.appendChild(g)});
 rows.filter(r=>r.count>0).forEach(r=>{const d=document.createElement("div");d.className="month-summary";d.innerHTML="<strong>"+r.m+"月</strong><br>販売："+r.count+"件　売上："+r.sales.toLocaleString()+"円<br>仕入れ："+r.purchase.toLocaleString()+"円　利益："+r.profit.toLocaleString()+"円";sum.appendChild(d)});
 if(!rows.some(r=>r.count>0))sum.innerHTML="<div class='message'>"+y+"年の売上記録はまだありません。</div>";
}
function refresh(){displaySales();calculateMonthly();setupYear();renderChart()}
calculateButton.onclick=calculate;saveSaleButton.onclick=addSale;requiredPriceButton.onclick=requiredPrice;deleteAllButton.onclick=deleteAll;chartYear.onchange=renderChart;
loadData();refresh();
</script>
</body>
</html>
